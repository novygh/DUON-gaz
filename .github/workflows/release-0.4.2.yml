name: Wydanie DUON Gaz 0.4.2

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Uruchom wydanie 0.4.2'
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Utwórz wydanie v0.4.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.4.2 \
            --target "2682cabc64dc2c2f156fc2da3002d82e0c5e6b29" \
            --title "DUON Gaz 0.4.2" \
            --notes-file RELEASE_NOTES_0.4.2.md

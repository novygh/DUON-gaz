name: Porządki gałęzi DUON Gaz

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-branches.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Usuń niechronione gałęzie poza main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" \
            --jq '.[] | select(.name != "main" and .protected == false) | .name' \
          | while IFS= read -r branch; do
              [[ -n "$branch" ]] || continue
              encoded="$(printf '%s' "$branch" | jq -sRr @uri)"
              echo "Usuwam: $branch"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$encoded"
            done

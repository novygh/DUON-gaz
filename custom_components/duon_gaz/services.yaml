import_history:
  name: Importuj historię
  description: Importuje zweryfikowaną historię odczytów gazomierza z pliku JSON w /config.
  fields:
    path:
      name: Plik
      description: Ścieżka względna w /config.
      required: false
      default: duon_gaz_history_seed.json
      selector:
        text:
    replace:
      name: Zastąp istniejące odczyty
      description: Pozwala zastąpić już zapisane odczyty po świadomym uruchomieniu usługi.
      required: false
      default: false
      selector:
        boolean:

import_invoice:
  name: Importuj fakturę PDF
  description: Odczytuje zaszyfrowaną fakturę DUON z katalogu /config, używając skonfigurowanego numeru licznika jako hasła PDF, zapisuje dane rozliczeniowe i w razie potrzeby aktualizuje historię kanoniczną.
  fields:
    path:
      name: Plik PDF
      description: Ścieżka do faktury względem katalogu /config, np. DUON/faktura.pdf.
      required: true
      selector:
        text:
    source_message_id:
      name: Identyfikator wiadomości
      description: Opcjonalny identyfikator wiadomości źródłowej do audytu.
      required: false
      selector:
        text:

sync_outlook:
  name: Sprawdź Outlook teraz
  description: Sprawdza skonfigurowany folder Outlook, pobiera nowe faktury DUON, odszyfrowuje je numerem licznika i importuje bez ponownego pytania o dane.

refresh_tail:
  name: Odśwież bieżący ogon
  description: Aktualizuje w Recorder tylko bieżącą, nierozliczoną część historii DUON. Gdy zmienił się odczyt fizyczny, źródło lub kalibracja, automatycznie wykonuje pełną przebudowę.
